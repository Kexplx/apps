<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="w-full pt-20 px-4">
    <div class="max-w-2xl mx-auto">
      <div class="gap-4 mb-8">
        <div class="text-2xl mb-4">Paste Raider.IO URL below...</div>
        <input
          type="text"
          id="rioUrl"
          placeholder="https://raider.io/characters/eu/draenor/Kanha"
          autofocus
          spellcheck="false"
          autocomplete="off"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="mt-8">
        <ul id="characterList" class="list-none pl-0 space-y-1"></ul>
      </div>
    </div>

    <script>
      const input = document.getElementById("rioUrl");
      const characterList = document.getElementById("characterList");
      const selectionHeader = document.getElementById("selectionHeader");

      function normalizeRealm(realm) {
        return realm
          .split("-")
          .map(
            (part) =>
              part.charAt(0).toUpperCase() + part.slice(1).toLowerCase(),
          )
          .join("-");
      }

      function decodeSegment(value) {
        try {
          return decodeURIComponent(value);
        } catch {
          return value;
        }
      }

      function redirectIfValid(value) {
        const match = value
          .trim()
          .match(
            /^https?:\/\/raider\.io\/characters\/([^/]+)\/([^/]+)\/([^/?#]+)(?:[?#].*)?$/i,
          );

        if (!match) return;

        const [, region, realm, character] = match;
        const decodedRealm = decodeSegment(realm);
        const decodedCharacter = decodeSegment(character);
        const normalizedRealm = normalizeRealm(decodedRealm);

        window.open(
          `https://www.warcraftlogs.com/character/${encodeURIComponent(region.toLowerCase())}/${encodeURIComponent(normalizedRealm)}/${encodeURIComponent(decodedCharacter.toLowerCase())}?zone=47`,
          "_blank",
        );

        const li = document.createElement("li");
        li.textContent = `${decodedCharacter} - ${normalizedRealm}`;
        li.title = "Click to highlight";
        li.className =
          "cursor-pointer py-1 px-2 rounded active:bg-gray-200 hover:bg-gray-100";
        li.addEventListener("click", () => {
          li.classList.toggle("bg-green-300");
          li.classList.toggle("hover:bg-green-400");
          li.classList.toggle("active:bg-green-500");
        });
        characterList.appendChild(li);

        input.value = "";
      }

      input.addEventListener("paste", (e) => {
        setTimeout(() => {
          redirectIfValid(e.target.value);
        }, 0);
      });

      input.addEventListener("input", (e) => {
        redirectIfValid(e.target.value);
      });
    </script>
  </body>
</html>
