<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCK Wallpaper Generator</title>

    <link rel="stylesheet" href="styles.min.css" />
    <link rel="shortcut icon" href="favicon.png" type="image/png" />
    <script src="html2canvas-pro.min.js"></script>

    <!-- Safari Header (even without webapp) -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="green" />
  </head>

  <body
    class="bg-neutral-950 text-white flex items-center justify-center text-lg"
  >
    <div
      class="w-full flex items-center justify-center"
      style="padding-top: 8rem"
    >
      <div class="w-full max-w-md px-10">
        <img
          src="AUMOVIO_Logo_web_orange_white_RGB.svg"
          alt="DCK Logo"
          class="w-36 mb-2"
        />
        <h1 class="text-2xl font-bold mb-6">DCK Wallpaper Generator</h1>

        <label for="friendlyName" class="mb-1 inline-block text-lg"
          >Friendly Name:</label
        >
        <input
          type="text"
          id="friendlyName"
          spellcheck="false"
          autocomplete="off"
          placeholder="Max Musters iPhone 11"
          class="bg-neutral-800 rounded border h-11 transition w-full border-neutral-600 text-[16px] px-4 py-2 focus:border-neutral-500 focus:bg-transparent outline-0"
        />

        <div class="mt-6">
          <button
            id="downloadBtn"
            class="w-full flex items-center justify-center rounded transition select-none bg-[#fd4308] outline-0 font-medium py-2 cursor-pointer hover:bg-[#fd4308]/80 active:bg-[#fd4308]/60"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#FFFFFF"
              class="me-2"
            >
              <path
                d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"
              />
            </svg>
            Download Wallpaper
          </button>
          <div
            id="successAlert"
            class="hidden text-green-500 mt-0 text-center p-2 px-4 font-medium"
          >
            ✓ check your downloads folder
          </div>
        </div>
      </div>

      <script>
        const template = (name) => `
      <div id="wallpaper"
           style="position:absolute; left:-9999px; top:-9999px;"
           class="bg-neutral-950 w-[360px] h-[800px] flex items-center justify-center px-8">
          <div class="flex flex-col items-center">
          <div class="text-white text-4xl font-bold text-center wrap-break-word">${name}</div>
          <div class="text-neutral-300 text-xl mb-8">DCK Simulation</div>
          <?xml version="1.0" encoding="UTF-8"?><svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 437.9999996748 54"
          class="w-28"
        >
          <g id="Brand_mark">
            <path
              d="M68.2992933022,31.1999960809c-2.5619049561-3.927258337-5.7236944422-5.5090542338-8.9396047732-5.5090542338-12.5913939454,0-33.3591261556,28.3090581529-53.9088393684,28.3090581529-4.03363145,0-5.4508491606-1.0908950569-5.4508491606-3.3272662708,0-.9817973784.2725426314-1.7454639217.8176280987-2.6181722246L28.9985117765,3.5454541001c1.4717432965-2.3454515521,3.1615055904-3.5454541001,5.0147724541-3.5454541001,2.0713439307,0,3.7611083754,1.5272712533,4.960253725,4.4181822972l13.5181112556,32.6182105195c3.7611062246,8.9999928309,9.4846329103,16.9636071833,17.6061663995,16.9636071833h6.8682113758c2.1802071801,0,3.434097085-1.6908914245,3.434097085-3.3272662708,0-.4908986892-.1093772727-.9817973784-.3816934745-1.4181794893l-11.7191372948-18.054558159Z"
              style="fill: #ff4208"
            />
          </g>
          <g id="Word_mark">
            <path
              d="M411.3689307469,53.4000036323c-15.1459219147,0-26.5594927985-11.4065122043-26.5594927985-26.4000315918,0-14.9934623933,11.4135708838-26.3999756729,26.5594927985-26.3999756729,15.2180830412,0,26.6310689279,11.4065132796,26.6310689279,26.3999756729,0,14.9935193875-11.4129858866,26.4000315918-26.6310689279,26.4000315918ZM411.3689307469,45.4369527699c9.9775747883,0,17.7303707707-7.9630508624,17.7303707707-18.4369807293,0-10.5456468688-7.7527959824-18.4369253482-17.7303707707-18.4369253482s-17.6582096441,7.8912784794-17.6582096441,18.4369253482c0,10.545703863,7.6806348558,18.4369807293,17.6582096441,18.4369807293Z"
              style="fill: #fff"
            />
            <path
              d="M369.288051059,52.1085061494V1.8911201621h8.6137398193v50.2173859873h-8.6137398193Z"
              style="fill: #fff"
            />
            <path
              d="M333.3655402484,52.1085061494L316.9995894439,1.8911201621h9.1876564951l14.2850124893,46.7739246454h.717722755l14.4281991597-46.7739246454h9.1882414923l-16.5819180102,50.2173859873h-14.8589635768Z"
              style="fill: #fff"
            />
            <path
              d="M289.6361384192,53.4000036323c-15.1459219147,0-26.5594927985-11.4065122043-26.5594927985-26.4000315918,0-14.9934623933,11.4135708838-26.3999756729,26.5594927985-26.3999756729,15.2180830412,0,26.6310689279,11.4065132796,26.6310689279,26.3999756729,0,14.9935193875-11.4129858866,26.4000315918-26.6310689279,26.4000315918ZM289.6361384192,45.4369527699c9.9775403767,0,17.7303707707-7.9630508624,17.7303707707-18.4369807293,0-10.5456468688-7.752830394-18.4369253482-17.7303707707-18.4369253482-9.9775747883,0-17.6582268499,7.8912784794-17.6582268499,18.4369253482,0,10.545703863,7.6806520616,18.4369807293,17.6582268499,18.4369807293Z"
              style="fill: #fff"
            />

              d="M199.2161821124,52.1085061494V1.8911201621h17.0126652215l10.9106453402,46.7739246454h.7182905464L239.9168813211,1.8911201621h16.2227813399v50.2173859873h-8.6137398193V5.3345997851h-.8614772167l-11.8437503037,46.7739063643h-14.8589291652l-11.2697992163-46.7739063643h-.8614772167v46.7739063643h-8.6143076107Z"
              style="fill: #fff"
            />
            <path
              d="M169.4565825105,53.3280618797c-13.2081358583,0-20.6734057113-7.5325875469-20.6734057113-20.3021432533V1.8911201621h8.6143076107v30.5608516783c0,8.034820557,4.0193265745,13.0565269487,12.1307086416,13.0565269487,8.1119498585,0,12.131276433-5.0217063916,12.131276433-13.0565269487V1.8911201621h8.6142904049v31.1347984643c0,12.8412694822-7.4658376445,20.3021432533-20.8171773789,20.3021432533Z"
              style="fill: #fff"
            />
            <path
              d="M96.6412961945,52.1085061494L112.9356746751,1.8911201621h15.6488216496l16.2227641341,50.2173859873h-9.1166309514l-3.7323596337-11.8369712184h-22.5395812268l-3.6613168842,11.8369712184h-9.1160755684ZM111.5718397061,33.3128361006h18.23271992l-8.829104822-27.9782363155h-.7177141521l-8.6859009459,27.9782363155Z"
              style="fill: #fff"
            />
          </g>
        </svg>
        </div>
      </div>
      `;

        document
          .getElementById("downloadBtn")
          .addEventListener("click", async () => {
            const name =
              document.getElementById("friendlyName").value.trim() ||
              "Wallpaper";

            const wrapper = document.createElement("div");
            wrapper.innerHTML = template(name);
            document.body.appendChild(wrapper);

            const node = wrapper.querySelector("#wallpaper");

            const canvas = await html2canvas(node, {
              scale: 3,
              useCORS: true,
            });

            canvas.toBlob((blob) => {
              const link = document.createElement("a");
              link.download = `DCK_Wallpaper_${name.replaceAll(
                /\s+/g,
                "_"
              )}.png`;
              link.href = URL.createObjectURL(blob);
              link.click();

              setTimeout(() => {
                document
                  .getElementById("successAlert")
                  .classList.remove("hidden");
              }, 2000); // arbitrary delay
            });

            document.body.removeChild(wrapper);
          });
      </script>
    </div>
  </body>
</html>
