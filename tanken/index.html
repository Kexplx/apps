<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanken</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.min.css" />

    <style>
      .loader {
        --color-1: #fff;
        --size: 0.9px;
        width: calc(48 * var(--size));
        height: calc(48 * var(--size));
        border: calc(5 * var(--size)) solid var(--color-1);
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Safari Header (even without webapp) -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="green" />
  </head>
  <body
    class="bg-neutral-950 text-neutral-200 pt-10 pb-24 flex flex-col items-center justify-center space-y-10"
    style="touch-action: manipulation"
  >
    <div
      id="fuelTypeSwitcher"
      class="fixed hidden top-16 right-4 z-50 flex-col items-center gap-1.5 rounded-lg border border-neutral-700 bg-neutral-900/60 p-1 shadow-lg backdrop-blur transition-all duration-300"
    ></div>

    <button
      id="fuelMenuToggle"
      type="button"
      aria-label="Kraftstoffauswahl ein-/ausblenden"
      class="fixed hidden top-4 right-4 z-50 h-10 items-center justify-center gap-1 transition-colors text-neutral-500"
    >
      <span id="fuelMenuLabel" class="w-20 text-neutral-500 text-right"></span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="currentColor"
        class="transition-transform duration-300"
      >
        <path d="M480-528 296-344l-56-56 240-240 240 240-56 56-184-184Z" />
      </svg>
    </button>

    <div
      id="stationContainer"
      class="flex flex-col items-center justify-center w-full space-y-8"
    >
      <div class="fixed inset-0 flex flex-col items-center justify-center">
        <span class="loader"></span>
        <p id="loadingCounter" class="mt-4">Lade Tankstellen...</p>

        <p class="text-neutral-500 text-sm mt-4 font-mono">v1327</p>
      </div>
    </div>

    <script src="utils.js"></script>
    <script src="app.js"></script>
  </body>
</html>
