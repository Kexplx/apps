<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="shortcut icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <title>QR Code Generator</title>
  </head>
  <body class="flex justify-center items-center h-screen">
    <div
      class="text-center absolute top-5 left-1/2 -translate-x-1/2 uppercase w-96 text-gray-400 tracking-tight text-sm"
    >
      <div>QR Code Generator</div>
    </div>

    <div class="relative">
      <div
        id="qr-box"
        style="
          box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px,
            rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
        "
        class="bg-gray-50 mt-2 w-[300px] h-[300px] rounded-lg overflow-hidden hover:bg-gray-100 cursor-pointer active:bg-gray-100 md:active:bg-gray-200 flex justify-center items-center select-none"
      >
        <span id="qr-label" class="font-medium text-gray-600 text-lg"
          >Tap to Paste Clipboard</span
        >
      </div>

      <button
        id="clear-btn"
        class="hidden text-center absolute -bottom-14 left-1/2 -translate-x-1/2 uppercase w-96 text-gray-500 font-medium text-sm underline underline-offset-2 cursor-pointer active:text-gray-600"
      >
        clear
      </button>
    </div>

    <script>
      document.addEventListener("touchstart", () => {}, true); // iOS fix

      const box = document.getElementById("qr-box");
      const label = document.getElementById("qr-label");
      const clearBtn = document.getElementById("clear-btn");

      let qr;

      box.addEventListener("click", async () => {
        try {
          const text = await navigator.clipboard.readText();
          if (!text.trim()) return;

          box.innerHTML = "";
          qr = new QRCode(box, {
            text,
            width: 300,
            height: 300,
            colorDark: "#262626",
            colorLight: "#f3f4f6",
          });

          clearBtn.classList.remove("hidden");
        } catch (err) {
          alert("Clipboard read failed. Make sure permissions are granted.");
          box.innerHTML = "";
          box.appendChild(label);
          clearBtn.classList.add("hidden");
        }
      });

      clearBtn.addEventListener("click", () => {
        box.innerHTML = "";
        box.appendChild(label);
        clearBtn.classList.add("hidden");
      });
    </script>
  </body>
</html>
