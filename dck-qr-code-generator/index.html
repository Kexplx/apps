<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="shortcut icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <title>QR Code Generator</title>
  </head>
  <body class="fixed inset-0 flex justify-center items-center overflow-hidden">
    
<button id="pasteBtn">Paste Text</button>
<p id="output"></p>

<script>
  const btn = document.getElementById('pasteBtn');
  const out = document.getElementById('output');

  btn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      out.textContent = text || '(Clipboard empty)';
    } catch (err) {
      out.textContent = 'Failed: ' + err;
    }
  });
</script>

  </body>
</html>
