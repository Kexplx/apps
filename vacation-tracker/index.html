<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vacation Tracker</title>
    <style>
      /*! tailwindcss v4.1.11 | MIT License | https://tailwindcss.com */
      @layer properties;
      @layer theme, base, components, utilities;
      @layer theme {
        :root,
        :host {
          --font-sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
            "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
          --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
            "Liberation Mono", "Courier New", monospace;
          --color-amber-400: oklch(82.8% 0.189 84.429);
          --color-slate-500: oklch(55.4% 0.046 257.417);
          --color-slate-900: oklch(20.8% 0.042 265.755);
          --color-white: #fff;
          --text-3xl: 1.875rem;
          --text-3xl--line-height: calc(2.25 / 1.875);
          --text-6xl: 3.75rem;
          --text-6xl--line-height: 1;
          --font-weight-medium: 500;
          --font-weight-extrabold: 800;
          --tracking-tighter: -0.05em;
          --default-font-family: var(--font-sans);
          --default-mono-font-family: var(--font-mono);
        }
      }
      @layer base {
        *,
        ::after,
        ::before,
        ::backdrop,
        ::file-selector-button {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          border: 0 solid;
        }
        html,
        :host {
          line-height: 1.5;
          -webkit-text-size-adjust: 100%;
          tab-size: 4;
          font-family: var(
            --default-font-family,
            ui-sans-serif,
            system-ui,
            sans-serif,
            "Apple Color Emoji",
            "Segoe UI Emoji",
            "Segoe UI Symbol",
            "Noto Color Emoji"
          );
          font-feature-settings: var(--default-font-feature-settings, normal);
          font-variation-settings: var(
            --default-font-variation-settings,
            normal
          );
          -webkit-tap-highlight-color: transparent;
        }
        hr {
          height: 0;
          color: inherit;
          border-top-width: 1px;
        }
        abbr:where([title]) {
          -webkit-text-decoration: underline dotted;
          text-decoration: underline dotted;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          font-size: inherit;
          font-weight: inherit;
        }
        a {
          color: inherit;
          -webkit-text-decoration: inherit;
          text-decoration: inherit;
        }
        b,
        strong {
          font-weight: bolder;
        }
        code,
        kbd,
        samp,
        pre {
          font-family: var(
            --default-mono-font-family,
            ui-monospace,
            SFMono-Regular,
            Menlo,
            Monaco,
            Consolas,
            "Liberation Mono",
            "Courier New",
            monospace
          );
          font-feature-settings: var(
            --default-mono-font-feature-settings,
            normal
          );
          font-variation-settings: var(
            --default-mono-font-variation-settings,
            normal
          );
          font-size: 1em;
        }
        small {
          font-size: 80%;
        }
        sub,
        sup {
          font-size: 75%;
          line-height: 0;
          position: relative;
          vertical-align: baseline;
        }
        sub {
          bottom: -0.25em;
        }
        sup {
          top: -0.5em;
        }
        table {
          text-indent: 0;
          border-color: inherit;
          border-collapse: collapse;
        }
        :-moz-focusring {
          outline: auto;
        }
        progress {
          vertical-align: baseline;
        }
        summary {
          display: list-item;
        }
        ol,
        ul,
        menu {
          list-style: none;
        }
        img,
        svg,
        video,
        canvas,
        audio,
        iframe,
        embed,
        object {
          display: block;
          vertical-align: middle;
        }
        img,
        video {
          max-width: 100%;
          height: auto;
        }
        button,
        input,
        select,
        optgroup,
        textarea,
        ::file-selector-button {
          font: inherit;
          font-feature-settings: inherit;
          font-variation-settings: inherit;
          letter-spacing: inherit;
          color: inherit;
          border-radius: 0;
          background-color: transparent;
          opacity: 1;
        }
        :where(select:is([multiple], [size])) optgroup {
          font-weight: bolder;

        :where(select:is([multiple], [size])) optgroup option {
          padding-inline-start: 20px;
        }
        ::file-selector-button {
          margin-inline-end: 4px;
        }
        ::placeholder {
          opacity: 1;
        }
        @supports (not (-webkit-appearance: -apple-pay-button)) or
          (contain-intrinsic-size: 1px) {
          ::placeholder {
            color: currentcolor;
            @supports (color: color-mix(in lab, red, red)) {
              color: color-mix(in oklab, currentcolor 50%, transparent);
            }
          }
        }
        textarea {
          resize: vertical;
        }
        ::-webkit-search-decoration {
          -webkit-appearance: none;
        }
        ::-webkit-date-and-time-value {
          min-height: 1lh;
          text-align: inherit;
        }
        ::-webkit-datetime-edit {
          display: inline-flex;
        }
        ::-webkit-datetime-edit-fields-wrapper {
          padding: 0;
        }
        ::-webkit-datetime-edit,
        ::-webkit-datetime-edit-year-field,
        ::-webkit-datetime-edit-month-field,
        ::-webkit-datetime-edit-day-field,
        ::-webkit-datetime-edit-hour-field,
        ::-webkit-datetime-edit-minute-field,
        ::-webkit-datetime-edit-second-field,
        ::-webkit-datetime-edit-millisecond-field,
        ::-webkit-datetime-edit-meridiem-field {
          padding-block: 0;
        }
        :-moz-ui-invalid {
          box-shadow: none;
        }
        button,
        input:where([type="button"], [type="reset"], [type="submit"]),
        ::file-selector-button {
          appearance: button;
        }
        ::-webkit-inner-spin-button,
        ::-webkit-outer-spin-button {
          height: auto;
        }
        [hidden]:where(:not([hidden="until-found"])) {
          display: none !important;
        }
      }
      @layer utilities {
        .flex {
          display: flex;
        }
        .h-screen {
          height: 100vh;
        }
        .w-screen {
          width: 100vw;
        }
        .items-center {
          align-items: center;
        }
        .justify-center {
          justify-content: center;
        }
        .bg-slate-900 {
          background-color: var(--color-slate-900);
        }
        .text-3xl {
          font-size: var(--text-3xl);
          line-height: var(--tw-leading, var(--text-3xl--line-height));
        }
        .text-6xl {
          font-size: var(--text-6xl);
          line-height: var(--tw-leading, var(--text-6xl--line-height));
        }
        .font-extrabold {
          --tw-font-weight: var(--font-weight-extrabold);
          font-weight: var(--font-weight-extrabold);
        }
        .font-medium {
          --tw-font-weight: var(--font-weight-medium);
          font-weight: var(--font-weight-medium);
        }
        .tracking-tighter {
          --tw-tracking: var(--tracking-tighter);
          letter-spacing: var(--tracking-tighter);
        }
        .text-amber-400 {
          color: var(--color-amber-400);
        }
        .text-slate-500 {
          color: var(--color-slate-500);
        }
        .text-white {
          color: var(--color-white);
        }
      }
      @property --tw-font-weight {
        syntax: "*";
        inherits: false;
      }
      @property --tw-tracking {
        syntax: "*";
        inherits: false;
      }
      @layer properties {
        @supports ((-webkit-hyphens: none) and (not (margin-trim: inline))) or
          ((-moz-orient: inline) and (not (color: rgb(from red r g b)))) {
          *,
          ::before,
          ::after,
          ::backdrop {
            --tw-font-weight: initial;
            --tw-tracking: initial;
          }
        }
      }
    </style>
  </head>
  <body>
    <div
      class="flex h-screen w-screen items-center justify-center bg-slate-900"
    >
      <div>
        <p class="text-3xl font-medium text-slate-500">🌴 Vacation in...</p>
        <p class="text-6xl font-extrabold text-white">
          <span id="daysCount" class="text-amber-400"></span>
          <span class="daysLabel"></span>
        </p>
      </div>
    </div>

    <script>
      function getDaysUntilVacation(vacationDate) {
        const [day, month, year] = vacationDate.split(".").map(Number);
        const vacation = new Date(year, month - 1, day);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diffTime = vacation - today;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      }

      const params = new URLSearchParams(window.location.search);
      const vacationDate = params.get("vacationDate");

      const countElem = document.getElementById("daysCount");
      const labelElem = document.querySelector(".daysLabel");
      const topElem = document.querySelector("p.text-3xl");

      if (vacationDate) {
        const days = getDaysUntilVacation(vacationDate);

        if (days <= 0) {
          countElem.textContent = "HAPPY";
          labelElem.textContent = "VACATION 🍹";
          topElem.style.display = "none";
        } else {
          countElem.textContent = days;
          labelElem.textContent = days === 1 ? "DAY" : "DAYS";
        }
      } else {
        countElem.textContent = "?";
        labelElem.textContent = "days";
      }
    </script>
  </body>
</html>
